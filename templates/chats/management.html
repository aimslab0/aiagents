<dialog id="chat-dialog" aria-labelledby="chat-dialog-title"><form method="post" id="chat-management-form">{% csrf_token %}<h2 id="chat-dialog-title">Manage research</h2><p id="chat-dialog-description"></p><label id="chat-input-label" for="chat-input">Title</label><input id="chat-input" class="form-control" name="title" maxlength="200" required><input id="chat-confirm" type="hidden" name="confirm_chat"><div class="quick-actions"><button type="button" class="btn btn-outline-secondary" id="chat-cancel">Cancel</button><button type="submit" class="btn research-button" id="chat-confirm-button">Confirm</button></div></form></dialog>
<p id="ui-feedback" class="ui-feedback" role="status" aria-live="polite"></p>
